name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare .env for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Prepare debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Restored debug.keystore from GitHub Secret."
          elif [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fresh debug.keystore."
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: epochlife-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  build-release:
    name: Build Signed Release APK & AAB
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check Release Signing Secret
        id: check_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_KEYSTORE_BASE64 secret not configured; skipping release build."
          fi

      - name: Checkout repository
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare .env for Secrets Gradle Plugin
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Decode Release Keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Build Signed Release APK & Bundle
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Clean Up Keystore
        if: always() && steps.check_keystore.outputs.has_keystore == 'true'
        run: rm -f my-upload-key.jks

      - name: Upload Release Artifacts
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: epochlife-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
